name: Official PSI bounded pair
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: official-psi-api
  cancel-in-progress: false
jobs:
  psi:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 38
    steps:
      - name: Reuse previously saved PSI responses
        uses: actions/download-artifact@v4
        with:
          name: psi-api-pair-40333771886
          run-id: 40333771886
          github-token: ${{ github.token }}
          path: seed
      - name: Official PSI sequential requests until pair
        shell: bash
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          mkdir -p results
          cat > series.py <<'PYTHON'
          """Bounded official PSI API series. No local browser. Stop on comparable pair."""
          import urllib.request, urllib.parse, urllib.error
          import json, pathlib, datetime, time, hashlib, os
          
          root=pathlib.Path('results'); root.mkdir(exist_ok=True)
          target='https://remont-holodilnikov.kz/remont-xolodilnikov-na-domu-v-g-almaty'
          params={'url':target,'strategy':'mobile','category':'performance','locale':'en-US'}
          key=os.environ.get('PSI_API_KEY','').strip()
          if not key: raise SystemExit('PSI_API_KEY missing; no request sent')
          endpoint='https://pagespeedonline.googleapis.com/pagespeedonline/v5/runPagespeed'
          url=endpoint+'?'+urllib.parse.urlencode(dict(params,key=key))
          groups={}; summaries=[]; selected=None; reason='maximum_10_total_requests'
          import shutil
          seed=pathlib.Path('seed')
          if seed.exists(): shutil.copytree(seed,root/'previous',dirs_exist_ok=True)
          for old in sorted(seed.glob('run-*/lighthouse-report.json')):
              lhr=json.loads(old.read_text()); number=old.parent.name
              signature={'lighthouseVersion':lhr.get('lighthouseVersion'),'userAgent':lhr.get('userAgent'),'configSettings':lhr.get('configSettings'),'finalDisplayedUrl':lhr.get('finalDisplayedUrl'),'finalUrl':lhr.get('finalUrl')}
              sig=hashlib.sha256(json.dumps(signature,sort_keys=True).encode()).hexdigest()
              lcp=lhr.get('audits',{}).get('largest-contentful-paint',{}).get('numericValue')
              group=groups.setdefault(sig,{})
              if isinstance(lcp,(int,float)) and lcp<=2500:
                  if 'fast' not in group or lcp<group['fast'][1]['audits']['largest-contentful-paint']['numericValue']: group['fast']=(number,lhr)
              oldsummary=old.parent/'summary.json'
              if oldsummary.exists(): summaries.append(json.loads(oldsummary.read_text()))
          def save(path,obj): path.write_text(json.dumps(obj,ensure_ascii=False,indent=2),encoding='utf-8')
          for number in range(7,11):
              out=root/f'run-{number:02d}'; out.mkdir()
              start=datetime.datetime.now(datetime.timezone.utc).isoformat(); clock=time.monotonic()
              meta={'parameters':params,'endpoint':endpoint,'started_utc':start,'api_key_used':True,'request_number':number}
              body=b''; status=None
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'PSI-diagnostic-series/1.0','Accept':'application/json'}),timeout=180) as res:
                      status=res.status; body=res.read(); meta['response_headers']=dict(res.headers)
              except urllib.error.HTTPError as error:
                  status=error.code; body=error.read(); meta['response_headers']=dict(error.headers)
              except Exception as error: meta['transport_error']=type(error).__name__
              if key.encode() in body: raise SystemExit('Credential unexpectedly in response; not saved')
              meta.update(http_status=status,elapsed_seconds=time.monotonic()-clock,body_sha256=hashlib.sha256(body).hexdigest(),body_bytes=len(body))
              (out/'response.json').write_bytes(body); save(out/'request-metadata.json',meta)
              try: data=json.loads(body)
              except Exception: data={}
              lhr=data.get('lighthouseResult',{}); audits=lhr.get('audits',{})
              metrics=audits.get('metrics',{}).get('details',{}).get('items',[{}])[0]
              values={k:audits.get(k,{}).get('numericValue') for k in ['first-contentful-paint','largest-contentful-paint','total-blocking-time','speed-index','cumulative-layout-shift','server-response-time']}
              signature={'lighthouseVersion':lhr.get('lighthouseVersion'),'userAgent':lhr.get('userAgent'),'configSettings':lhr.get('configSettings'),'finalDisplayedUrl':lhr.get('finalDisplayedUrl'),'finalUrl':lhr.get('finalUrl')}
              sig=hashlib.sha256(json.dumps(signature,sort_keys=True).encode()).hexdigest()
              row={'run':number,'started_utc':start,'fetchTime':lhr.get('fetchTime'),'http_status':status,'runtimeError':lhr.get('runtimeError'),'error':data.get('error'),'score':lhr.get('categories',{}).get('performance',{}).get('score'),'values':values,'metrics':metrics,'signature':sig,'environment':lhr.get('environment'),'runWarnings':lhr.get('runWarnings')}
              save(out/'summary.json',row); summaries.append(row); save(root/'series-summary.json',summaries)
              if lhr: save(out/'lighthouse-report.json',lhr)
              print('RUN_SUMMARY '+json.dumps({k:v for k,v in row.items() if k not in ['metrics','environment','error','runWarnings']},ensure_ascii=True),flush=True)
              print('OBSERVED '+json.dumps({k:v for k,v in metrics.items() if k in ['observedFirstContentfulPaint','observedLargestContentfulPaint','observedDomContentLoaded','observedLoad','observedFirstVisualChange','observedNavigationStartTs']},ensure_ascii=True),flush=True)
              if status!=200 or not lhr or lhr.get('runtimeError'):
                  reason='api_or_measurement_error'; break
              if any(previous.get('fetchTime')==row.get('fetchTime') for previous in summaries[:-1]):
                  reason='duplicate_report_no_more_requests'; break
              lcp=values['largest-contentful-paint']; group=groups.setdefault(sig,{})
              if isinstance(lcp,(int,float)):
                  if lcp<=2500 and 'fast' not in group: group['fast']=(number,lhr)
                  if lcp>=5000 and 'slow' not in group: group['slow']=(number,lhr)
              if 'fast' in group and 'slow' in group:
                  selected=group; reason='comparable_pair_found'; break
              if number<10: time.sleep(90)
          save(root/'stop.json',{'reason':reason,'requests':len(summaries),'thresholds_ms':{'fast_max':2500,'slow_min':5000},'pair':{k:v[0] for k,v in selected.items()} if selected else None})
          print('STOP '+json.dumps(json.loads((root/'stop.json').read_text())),flush=True)
          if selected:
              wanted=['metrics','lcp-breakdown-insight','lcp-discovery-insight','document-latency-insight','network-requests','network-dependency-tree-insight','render-blocking-insight','font-display-insight','main-thread-tasks','mainthread-work-breakdown','bootup-time','third-parties-insight','long-tasks','diagnostics','resource-summary']
              comparison={}
              for label,(number,lhr) in selected.items():
                  comparison[label]={'run':number,'fetchTime':lhr.get('fetchTime'),'environment':lhr.get('environment'),'configSettings':lhr.get('configSettings'),'userAgent':lhr.get('userAgent'),'runWarnings':lhr.get('runWarnings'),'audits':{k:lhr['audits'].get(k) for k in wanted}}
              save(root/'pair-comparison.json',comparison)
              for label,item in comparison.items():
                  print('PAIR_META '+json.dumps({k:v for k,v in item.items() if k!='audits'}),flush=True)
                  for name,audit in item['audits'].items():
                      payload=json.dumps(audit,ensure_ascii=True,separators=(',',':'))
                      for offset in range(0,len(payload),700): print('AUDIT_CHUNK '+label+' '+name+' '+str(offset)+' '+payload[offset:offset+700],flush=True)
          PYTHON
          cp series.py results/series.py
          python3 series.py
      - name: Save every PSI response and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-api-pair-${{ github.run_id }}
          path: results/
          retention-days: 14
          if-no-files-found: error
