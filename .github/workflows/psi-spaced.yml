name: Official PSI five spaced requests
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: official-psi-api
  cancel-in-progress: false
jobs:
  psi:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: psi-api-pair-40381049934
          run-id: 40381049934
          github-token: ${{ github.token }}
          path: seed
      - name: At most five official PSI calls with five minute gaps
        env:
          PSI_API_KEY: ${{ secrets.PSI_API_KEY }}
        run: |
          cat > series.py <<'PYTHON'
          import os,json,pathlib,time,datetime,hashlib,urllib.request,urllib.parse,urllib.error
          root=pathlib.Path('results');root.mkdir(exist_ok=True)
          target='https://remont-holodilnikov.kz/remont-xolodilnikov-na-domu-v-g-almaty'
          params={'url':target,'strategy':'mobile','category':'performance','locale':'en-US'}
          key=os.environ['PSI_API_KEY'].strip()
          if not key:raise SystemExit('Missing secret; no request')
          url='https://pagespeedonline.googleapis.com/pagespeedonline/v5/runPagespeed?'+urllib.parse.urlencode(dict(params,key=key))
          seen={}
          for p in pathlib.Path('seed').rglob('lighthouse-report.json'):
              old=json.loads(p.read_text());seen[old.get('fetchTime')]=str(p)
          rows=[];reason='five_request_limit'
          def save(p,o):p.write_text(json.dumps(o,ensure_ascii=False,indent=2),encoding='utf-8')
          for n in range(1,6):
              dest=root/f'run-{n:02d}';dest.mkdir()
              started=datetime.datetime.now(datetime.timezone.utc).isoformat();body=b'';status=None;meta={'started_utc':started,'parameters':params,'request':n}
              print('REQUEST_START',n,started,flush=True)
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/json'}),timeout=180) as res:
                      status=res.status;body=res.read();meta['headers']=dict(res.headers)
              except urllib.error.HTTPError as e:status=e.code;body=e.read()
              except Exception as e:meta['transport_error']=type(e).__name__
              if key.encode() in body:raise SystemExit('Unexpected credential in response')
              meta.update(http_status=status,finished_utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),sha256=hashlib.sha256(body).hexdigest())
              (dest/'response.json').write_bytes(body);save(dest/'metadata.json',meta)
              try:data=json.loads(body)
              except Exception:data={}
              lhr=data.get('lighthouseResult',{});a=lhr.get('audits',{});stamp=lhr.get('fetchTime')
              if lhr:save(dest/'lighthouse-report.json',lhr)
              requests=a.get('network-requests',{}).get('details',{}).get('items',[])
              docs=[q for q in requests if q.get('resourceType')=='Document' and q.get('url','').rstrip('/')==target]
              doc=docs[0] if docs else {}
              nodes=a.get('lcp-breakdown-insight',{}).get('details',{}).get('items',[])
              node=next((v for v in nodes if v.get('type')=='node'),{})
              content_ok=('post-2125' in node.get('selector','') or 'attachment_2126' in node.get('selector','')) and any('/wp-content/themes/remontholodilnikov2/' in q.get('url','') for q in requests)
              valid=status==200 and not lhr.get('runtimeError') and doc.get('statusCode')==200 and content_ok and lhr.get('finalDisplayedUrl',lhr.get('finalUrl','')).rstrip('/')==target
              duplicate=seen.get(stamp) if stamp else None
              if stamp and not duplicate:seen[stamp]=f'new-run-{n:02d}'
              m=a.get('metrics',{}).get('details',{}).get('items',[{}])[0]
              row={'request':n,'started_utc':started,'fetchTime':stamp,'api_status':status,'document_status':doc.get('statusCode'),'valid_page':valid,'duplicate_of':duplicate,'score':lhr.get('categories',{}).get('performance',{}).get('score'),'lcp':a.get('largest-contentful-paint',{}).get('numericValue'),'observed_lcp':m.get('observedLargestContentfulPaint'),'fcp':a.get('first-contentful-paint',{}).get('numericValue'),'tbt':a.get('total-blocking-time',{}).get('numericValue'),'node':node,'runtimeError':lhr.get('runtimeError')}
              rows.append(row);save(dest/'summary.json',row);save(root/'summary.json',rows)
              print('RESULT',json.dumps(row,ensure_ascii=True,separators=(',',':')),flush=True)
              if valid and not duplicate and isinstance(row['lcp'],(int,float)) and row['lcp']>=5000:
                  reason='valid_independent_lcp_at_least_5000';break
              if status in (401,403,429):reason='api_access_or_quota_error';break
              if n<5:
                  print('WAIT 300 seconds; no replacement requests for duplicates or 502',flush=True)
                  for _ in range(5):time.sleep(60)
          save(root/'stop.json',{'reason':reason,'requests':len(rows),'independent_new':sum(bool(r['fetchTime']) and not r['duplicate_of'] for r in rows),'valid_independent':sum(r['valid_page'] and not r['duplicate_of'] for r in rows)})
          print('STOP',json.dumps(json.loads((root/'stop.json').read_text())),flush=True)
          PYTHON
          python3 series.py
      - name: Save every complete response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psi-spaced-${{ github.run_id }}
          path: results/
          retention-days: 30
          if-no-files-found: error
